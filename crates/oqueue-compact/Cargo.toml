[package]
name = "oqueue-compact"
description = "Compaction planning and execution: deciding which objects to merge, and doing it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# ⚠️ `oqueue-core` and nothing else in this workspace — `architecture.md`'s star
# topology, enforced by `check-layering.sh`. A dependency on a sibling crate is a layering violation, not a shortcut.
[dependencies]
oqueue-core = { path = "../oqueue-core" }

[dev-dependencies]
# ⚠️ Not a production dependency, and this crate takes no runtime handle: the
# merge executor is an `async fn` over `ObjectStore`'s own `BoxFuture`s, so
# whichever crate drives one owns the runtime. Only the test binary needs one,
# to await a merge against the fake store. `oqueue-store`'s own dev-dependency
# comment is the precedent; features come from the workspace pin.
tokio = { workspace = true }
# ⚠️ `M5.22`: FR-35's invariant test runs under `run_seeded`, M10's
# deterministic schedule. Dev-only, as in `oqueue-broker`.
oqueue-testkit = { path = "../oqueue-testkit" }

[lints]
workspace = true

# The fuzz harness for every decoder in oqueue-codec -- security.md rule 5,
# testing.md rule 24, invoked by scripts/fuzz.sh.
#
# ⚠️ Deliberately its own workspace ([workspace] below): fuzz targets need
# libfuzzer-sys and a nightly sanitizer runtime, and neither belongs in the
# root workspace's dependency tree or under its lints. cargo-fuzz owns this
# manifest's shape.
[package]
name = "oqueue-codec-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
oqueue-codec = { path = "..", features = ["gzip", "snappy"] }
# The `request` target drives the broker's whole dispatch path -- header,
# per-API body decoders, handlers -- the way a socket would (M2.34, closing
# the M2.26/M2.27 DoS: no runtime kafka-protocol left to allocate from).
oqueue-broker = { path = "../../oqueue-broker" }
# ⚠️ **`M3.14` made the dispatch path real, so the target has to compose one.**
# A `Dispatcher` now needs a `Coordinator`, an index and an object store, and
# its handlers await — so a single `poll` no longer runs the path and a runtime
# is what drives it. This is also the reason this manifest must be built by
# `scripts/fuzz.sh`: it is its own workspace, so `cargo test --workspace` does
# not compile it, and `M3.14`'s review found it broken for exactly that reason.
oqueue-coordinator = { path = "../../oqueue-coordinator" }
oqueue-core = { path = "../../oqueue-core" }
tokio = { version = "1", features = ["rt", "macros"] }

[[bin]]
name = "frame"
path = "fuzz_targets/frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "request"
path = "fuzz_targets/request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "flex"
path = "fuzz_targets/flex.rs"
test = false
doc = false
bench = false

[[bin]]
name = "varint"
path = "fuzz_targets/varint.rs"
test = false
doc = false
bench = false

[[bin]]
name = "batch"
path = "fuzz_targets/batch.rs"
test = false
doc = false
bench = false

[[bin]]
name = "records"
path = "fuzz_targets/records.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compress"
path = "fuzz_targets/compress.rs"
test = false
doc = false
bench = false

[workspace]

[package]
name = "oqueue-codec"
description = "The Kafka wire protocol: request and response framing, and RecordBatch encode/decode."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# ⚠️ `oqueue-core` and nothing else in this workspace — `architecture.md`'s star
# topology, enforced by `check-layering.sh`. A dependency on a sibling crate is a layering violation, not a shortcut.
[dependencies]
oqueue-core = { path = "../oqueue-core" }
# The compression seam's wired codecs, both pure Rust (doc 20 §1: no C
# toolchain). Decode is all M2 needs -- a fetch echoes stored batches -- so
# ruzstd's decode-only surface is the point, not a limitation; records.rs's
# module doc carries the zstd-compression deferral.
lz4_flex = "0.14"
ruzstd = "0.9"
# Behind features, still pure Rust (flate2's default rust_backend; snap).
flate2 = { version = "1", optional = true }
snap = { version = "1", optional = true }

[features]
gzip = ["dep:flate2"]
snappy = ["dep:snap"]

[dev-dependencies]
proptest.workspace = true
# Test-only: the differential CRC check composes this crate's coverage slice
# with the real checksum. At runtime that composition is the broker's
# (check-layering.sh: a library depends on oqueue-core and nothing else);
# manifest.py's runtime_deps deliberately excludes dev-dependencies, so this
# crosses no layering rule.
oqueue-checksum = { path = "../oqueue-checksum" }
# Test-only: the buffer types kafka-protocol's RecordBatchEncoder takes in
# the golden cross-check. Not a runtime dep -- M2.16's review took it out of
# the contract, and it stays out.
bytes = "1"
# Test-only: constructing the `Uuid` topic-id values the differential feeds
# `kafka-protocol`. Runtime code represents ids as `[u8; 16]`, so this is a
# dev dependency, not a contract one.
uuid = { version = "1", default-features = false }
# ⚠️ **Test-only oracle now (`ADR-0019`).** `ADR-0017` had this as a runtime
# dependency and the single protocol surface; `M2.30` removed the last runtime
# use (the header path), so it moves here — the differential oracle every
# hand-rolled codec is byte-checked against. `client` is added for the
# response *decode* those differentials need (a broker only encodes responses,
# so the runtime `broker` feature could not decode them).
kafka-protocol = { version = "0.18.0", default-features = false, features = [
    "broker",
    "client",
] }

[lints]
workspace = true

[package]
name = "oqueue-broker"
description = "The I/O shell: the connection loop, request dispatch, and the batching that turns many small produces into few large PUTs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# ⚠️ `oqueue-core` and nothing else in this workspace — `architecture.md`'s star
# topology, enforced by `check-layering.sh`. This crate is a named composer, so it may also depend on other workspace crates as it grows.
[dependencies]
oqueue-core = { path = "../oqueue-core" }
# A composer (architecture.md): the protocol surface, and the checksum the
# ingest rule composes with it (M2.19's one-liner, wired at M2.23).
oqueue-codec = { path = "../oqueue-codec" }
oqueue-checksum = { path = "../oqueue-checksum" }
# M3.14: the handlers stop serving a stub. The coordinator sequences offsets
# and journals them; the index resolves offset->object. ⚠️ No `oqueue-index`
# and no `oqueue-store`: the concrete materialization and the concrete backend
# are the composition root's to choose (FR-50), and this crate is written
# against `oqueue-core`'s seams for both.
oqueue-coordinator = { path = "../oqueue-coordinator" }
# ⚠️ `M5.91`: the retention task runs `oqueue-compact`'s expiry heap and
# object lifecycle; a composer is the only kind of crate that may.
oqueue-compact = { path = "../oqueue-compact" }
# `error-handling.md` rule 3: a public error is a `thiserror` type a caller can
# match and render, not a bare enum.
thiserror.workspace = true
# The runtime this shell is written against (ADR-0008 already chose the
# ecosystem; doc 05 §3 the crate). Feature-minimal: the connection task
# needs io + sync + rt; `net` stays out until bin/oqueue binds a listener.
# ⚠️ `macros` is load-bearing in the LIB (connection.rs's `select!`), not a
# test convenience -- workspace feature-unification with dev-deps hid its
# absence until the out-of-workspace fuzz build (`M2.34`) compiled this
# crate alone.
tokio = { version = "1", features = ["io-util", "sync", "rt", "time", "macros"] }
# Topic ids on the modern wire (Produce v13, Fetch v13+, Metadata v10+) --
# oqueue-codec deals in `[u8; 16]`; this crate is where they meet `Uuid`.
uuid = { version = "1", default-features = false }
# `M9.5`: TLS termination. `tls.rs` is generic over `S: AsyncRead +
# AsyncWrite` (`serve_connection`'s own precedent), so no `tokio` "net"
# feature is needed here -- `bin/oqueue` owns the real `TcpStream`, this
# crate only wraps whatever stream it is handed.
tokio-rustls.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
tracing.workspace = true

# ⚠️ **Test-only now (`ADR-0019`).** `ADR-0017` had this as the dispatcher's
# generated message layer; `M2.31`-`M2.34` hand-rolled every message this
# broker answers, so no runtime code here imports it. It stays as the
# differential oracle the codec's own tests are checked against, and as
# what this crate's own tests use to build request bytes and decode
# responses -- `client` is added for that.
[dev-dependencies]
# ⚠️ `M10.5`: `virtual_time.rs` drives `run_seeded` to measure the premise the
# clock rule rests on. Dev-only — `check-layering.sh` forbids the runtime form.
oqueue-testkit = { path = "../oqueue-testkit" }
kafka-protocol = { version = "0.18.0", default-features = false, features = ["broker", "client"] }
# Test fixtures hand the dependency's request types their batch bytes.
bytes = "1"
# duplex-driven T1 tests: no real socket below bin/oqueue.
tokio = { version = "1", features = ["io-util", "sync", "rt", "rt-multi-thread", "macros", "time", "test-util"] }
# `M7.5`: live heap bytes for `tests/scale`'s NFR-10/11 test (`ADR-0049` point
# 5). A counting `GlobalAlloc` needs `unsafe impl`, which non-negotiable 7
# keeps out of this crate; this one wraps `System` in pure Rust, no C
# toolchain and no dependencies of its own. Set as the allocator of that one
# test binary only, never of a library.
stats_alloc = "0.1"
tracing-subscriber.workspace = true

[lints]
workspace = true

[package]
name = "oqueue-broker"
description = "The I/O shell: the connection loop, request dispatch, and the batching that turns many small produces into few large PUTs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# ⚠️ `oqueue-core` and nothing else in this workspace — `architecture.md`'s star
# topology, enforced by `check-layering.sh`. This crate is a named composer, so it may also depend on other workspace crates as it grows.
[dependencies]
oqueue-core = { path = "../oqueue-core" }
# A composer (architecture.md): the protocol surface. The checksum joins
# when the ingest rule wires in (M2.23), not before -- an unused dep is a
# claim review measured false once already.
oqueue-codec = { path = "../oqueue-codec" }
# The runtime this shell is written against (ADR-0008 already chose the
# ecosystem; doc 05 §3 the crate). Feature-minimal: the connection task
# needs io + sync + rt; `net` stays out until bin/oqueue binds a listener.
tokio = { version = "1", features = ["io-util", "sync", "rt", "time"] }

# The dispatcher builds responses from the generated message layer -- the
# same single-surface rule as oqueue-codec's (ADR-0017): only these two
# crates touch it.
kafka-protocol = { version = "0.18.0", default-features = false, features = ["broker"] }

[dev-dependencies]
# Tests act as the client and decode responses, which needs the client half.
kafka-protocol = { version = "0.18.0", default-features = false, features = ["broker", "client"] }
# duplex-driven T1 tests: no real socket below bin/oqueue.
tokio = { version = "1", features = ["io-util", "sync", "rt", "rt-multi-thread", "macros", "time", "test-util"] }

[lints]
workspace = true

[package]
name = "oqueue-core"
description = "Types, IDs, errors, and every trait seam. No I/O, no async runtime, no workspace dependencies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# ⚠️ **No *workspace* dependency, ever**, and that is the rule this crate exists
# to hold: `architecture.md`'s star topology has every other crate depending on
# `oqueue-core` and on nothing else here, which only works if `oqueue-core`
# depends on no workspace crate. `check-layering.sh` enforces that direction.
#
# ⚠️ External dependencies are a different question and are **not** forbidden —
# `architecture.md:45` says "no dependencies on anything else *here*". They are
# expensive rather than banned: every crate rebuilds when this one changes. Each
# one needs a reason at this line.
[dependencies]
# `error-handling.md` rule 3: each crate defines its error enum with thiserror.
# Proc macro, no C toolchain, no runtime cost — verified with `cargo tree`.
thiserror.workspace = true
# `security.md` rule 8: `Dek` wipes its bytes on drop, and `Redacted<T>` can
# be wiped explicitly where `T: Zeroize`. Pure Rust, no C toolchain — verified
# with `cargo tree`. (`M8.1`.)
zeroize.workspace = true
# `security.md`'s timing-oracle concern: comparing two secrets must not leak
# their contents through how long it takes. Pure Rust, no C toolchain —
# verified with `cargo tree`. (`M8.1`.)
subtle.workspace = true

[dev-dependencies]
# `testing.md` rule 20 (property tests over example tests) and doc 18 §5.6,
# which lists proptest as mandatory on every PR. ⚠️ A dev-dependency, so it is
# never in the shipped graph -- and invisible to `check-layering.sh`, which
# reads `[dependencies]` only.
proptest.workspace = true

[lints]
workspace = true

[package]
name = "oqueue"
description = "The oqueue broker: the composition root, and the only place a concrete type is chosen."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# ⚠️ **A composer**, and one of only two — `check-layering.sh`'s `COMPOSERS` set
# is `{oqueue-broker, oqueue}`. Every other crate may depend on `oqueue-core`
# and nothing else here; these two may depend on siblings, because choosing
# which concrete type goes behind which seam is their whole job (FR-50).
[dependencies]
oqueue-core = { path = "../../crates/oqueue-core" }
oqueue-crypto = { path = "../../crates/oqueue-crypto", default-features = false }
# `serve` composes the I/O shell (M2.25): the connection task, the
# dispatcher and the cluster all live there.
oqueue-broker = { path = "../../crates/oqueue-broker", default-features = false }
# M3.14: the concrete choices `serve` now has to make. The coordinator's loop
# is spawned here because `async-concurrency.md` rule 13 says a spawned task
# needs an owner, and this is the only place that knows who that is; the
# materialized index is a *choice* between implementations (doc 10 #12), which
# is what a composition root is for.
oqueue-coordinator = { path = "../../crates/oqueue-coordinator" }
oqueue-index = { path = "../../crates/oqueue-index" }
# ⚠️ **The dependency `M1.39` said adding would be a deliberate act.** It is
# that act: `M3` is the milestone where a record is acknowledged only after it
# is in object storage, so this is the first time the binary must *hand* an
# `ObjectStore` to something.
oqueue-store = { path = "../../crates/oqueue-store", default-features = false }
# `M4.18`: the composition root terminates TLS, so it needs the acceptor type
# `oqueue-broker`'s own `tls` module hands back. ⚠️ No new C toolchain — the
# `ring` provider `ADR-0012` chose is already in this tree via `oqueue-crypto`
# and `oqueue-store`, and this manifest pulls the same one.
tokio-rustls.workspace = true
# `M4.18`: the security configuration's own error type, the same way every
# other crate here spells one.
thiserror.workspace = true
# The listener itself -- `net` arrives exactly when the composition root
# binds one, as oqueue-broker's manifest promised.
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time"] }
# ⚠️ The global allocator, and the only place one may be set — ADR-0007.
mimalloc.workspace = true
# ⚠️ Heap profiling, **off by default**. jemalloc bakes in the *build host's*
# page size, so a binary built on a 4 KB-page host aborts at startup on a
# 64 KB-page aarch64 kernel; NFR-40 makes aarch64 first-class, so this cannot be
# the default. See ADR-0007 and doc 18 §3.5.
tikv-jemallocator = { workspace = true, optional = true }
tracing-subscriber.workspace = true

[features]
default = ["software-aead", "ring"]
software-aead = ["oqueue-crypto/software-aead"]
ring = ["oqueue-store/ring", "oqueue-broker/ring"]
fips = ["oqueue-crypto/fips", "oqueue-store/fips", "oqueue-broker/fips"]
## Swaps the global allocator for jemalloc, whose `prof` support is what makes
## a "memory grows under a specific consumer pattern" bug findable.
## ⚠️ Needs `JEMALLOC_SYS_WITH_LG_PAGE=16` whenever the deployment host may have
## a larger page than the build host, or it aborts at startup.
## ⚠️ **`tikv-jemallocator/profiling` is the load-bearing half.** Without it
## the allocator is swapped but jemalloc is configured with profiling compiled
## out — `_RJEM_MALLOC_CONF=prof:true` is rejected as an invalid conf pair and no
## dump is ever written. A feature named `heap-profiling` that does not profile
## is the defect this line exists to prevent; review found it.
heap-profiling = ["dep:tikv-jemallocator", "tikv-jemallocator/profiling"]

[lints]
workspace = true

# Push-triggered, not PR-triggered. `M-1.14`.
#
# Commits go directly to main; there are no pull requests for a gate to key
# off. doc 10 (open question 1) names this adaptation explicitly: "PR-triggered
# gates must become push-triggered. ... Anything keyed to `origin/main...`
# needs rebasing onto the previous commit." No gate in this repository is
# currently written against `origin/main...` -- none of them do PR-style
# diff-narrowing yet, that is a later milestone's mutation-testing gate -- but
# this workflow itself has the same shape of problem in miniature: the
# pre-commit-stage gates below compare **the staged index against HEAD**,
# which only means something if something is staged. After a push there is
# nothing staged; everything is already committed. The direct-to-main
# equivalent of "the staged index" is **a pushed commit's own tree**, and the
# equivalent of "HEAD" is **its parent** -- so each commit in the pushed range
# is checked out in turn and moved back one commit with `git reset --soft`,
# which leaves that commit's changes staged against its own parent without
# touching the working tree, and runs the same gates a local `pre-commit`
# hook would have run at the moment that commit was made.
#
# ⚠️ **Every commit in the push, not just its tip.** The milestone skill's own
# working style is many commits before one push ("never push unless asked"),
# so a push routinely carries more than one. An earlier version of this
# workflow checked only `github.sha` against its immediate parent, which
# silently never examined any earlier commit in the same push -- found by
# review, reproduced by stacking a deliberately malformed commit behind a
# clean tip and confirming the job reported green. `github.event.before` is
# the ref before the push; every commit in `before..sha` is walked in order.
# `fetch-depth: 0` (full history, not a fixed shallow number) is required
# because how many commits a push carries is unbounded by design here, and a
# fixed depth just moves the same silent-miss failure to a bigger batch.
#
# Calls scripts/*.sh through `pre-commit run`, the same dispatcher and the
# same .pre-commit-config.yaml a local clone installs -- doc 21 §9's rule
# that a check implemented in two places drifts, and the version that
# matters is whichever one nobody ran. Nothing here reimplements a check;
# it only decides when, and against which commit, the existing ones run.
#
# ⚠️ **A commit is checked only against what existed at that commit.** This
# task's own introduction is the concrete case, not a hypothetical one: at
# the moment this workflow first runs for real, the push it runs against
# will carry several already-`done`, already-reviewed commits made *before*
# `.pre-commit-config.yaml` existed at all. Found by review: an earlier
# version ran `pre-commit run` against every commit in the walked range
# unconditionally, which failed with `.pre-commit-config.yaml is not a
# file` for each of those — a false failure indistinguishable from a real
# one, reproduced against this repository's actual pending history. The
# same problem generalizes to any gate script the walk might reach further
# back than its own introducing commit (the bootstrap "first push ever"
# case walks the entire history). `present_at` (defined in the run step
# below, where the shell actually executes) checks, at the specific commit
# being examined, whether the file about to be invoked exists there at all.
name: gates

# Quoted: unquoted `on:` is YAML 1.1's boolean literal `true`, which GitHub's
# own parser special-cases correctly but a generic YAML 1.1 loader (PyYAML's
# `safe_load`, used to validate this file locally) does not -- confirmed by
# running it here, not assumed.
"on":
  push:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the walk below needs every commit back to
          # `github.event.before`, and a push's size is not bounded, so no
          # fixed shallow depth is honest here -- see the header.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: install pre-commit
        run: pip install pre-commit

      # `M0.2`. `check-crate.sh` shells out to cargo, and `lib.sh`'s
      # `require_tool` turns a missing tool into a *skip* rather than a
      # failure -- deliberately, so a missing tool is never mistaken for a
      # failing check. The consequence here is that a runner without cargo
      # would make the workspace's fmt, clippy and test gate skip silently,
      # which is the one outcome worse than it failing.
      #
      # ⚠️ No third-party toolchain action, and no version named here.
      # `rustup` ships on the runner image, and `rust-toolchain.toml` is what
      # decides the version -- `rustup show` reads it and installs what it
      # pins, including both Linux targets. A version written here would be a
      # second place holding the toolchain fact, which is exactly what
      # `build.md` rule 1 exists to prevent.
      - name: install the pinned toolchain
        run: |
          rustup show
          cargo --version
          rustc --version

      # ⚠️ **Cache the cargo build, or every run is a cold one.** Doc 18 §3.7.6
      # names this action specifically: it prunes to the actual dependency graph,
      # which is why hand-rolled `actions/cache` setups grow forever and this one
      # does not. `M0.16` needs it for a second reason — `check-budget.sh`
      # measures the warm inner loop, and an uncached runner makes every CI run a
      # compiling run, which that gate then declines to measure at all.
      - uses: Swatinem/rust-cache@v2

      # ⚠️ **Without this, `check-coverage.sh` skips and the job stays green.**
      # The script turns a missing `cargo-llvm-cov` into a `skip` — correct
      # behaviour for a developer's machine, and the one outcome worse than
      # failing when it happens on CI, for the same reason the step above
      # exists. `ubuntu-latest` ships rustup, cargo, clippy and rustfmt, and
      # not this. `M0.15`.
      - name: install cargo-llvm-cov
        run: |
          cargo install cargo-llvm-cov --locked
          cargo llvm-cov --version

      # ⚠️ CI runs the **full** mutation pass; pre-commit runs the narrowed one.
      # Both halves of `testing.md` rule 16, and no conflict with NFR-56 — a
      # narrowed run is ~4.8 s warm, not the 23 s an unnarrowed one costs.
      # `M0.17`.
      - name: install cargo-mutants
        run: |
          cargo install cargo-mutants --locked
          cargo mutants --version

      - name: gates, once per commit in this push
        env:
          # check-reviewed.sh reads target/review/<hash>.json, which
          # .gitignore documents as "consumed on the machine that made
          # [it]" -- gitignored on purpose, since the verdict gates
          # *creating* the commit and is regenerable, not a durable record
          # like reviews/ is. A fresh CI checkout never has it, for any
          # commit, reviewed or not, so running this check here cannot
          # distinguish "reviewed, but the artifact wasn't on this machine"
          # from "never reviewed" -- it would fail every push regardless.
          # This is not a workaround for a gap; per-commit review is
          # architecturally a local, pre-commit-time-only gate: the commit
          # cannot exist in history unless it already passed locally, under
          # the honesty assumption non-negotiable 3 names as the one thing
          # no script enforces. CI re-verifying it would require persisting
          # every per-commit verdict somewhere durable, which is a real,
          # separate design change -- not this task's to make.
          SKIP: check-reviewed
          # `build.md` rule 21. Incremental compilation is pure overhead where
          # every build starts clean, and this step is the first one in this
          # workflow that compiles anything -- `check-crate.sh` runs clippy and
          # the tests. `M0.2`.
          CARGO_INCREMENTAL: "0"
        run: |
          set -euo pipefail

          # Whether path $2 exists in commit $1's tree -- guards every
          # invocation below against a commit older than the file it is
          # about to call.
          present_at() {
            git cat-file -e "$1:$2" 2>/dev/null
          }

          before="${{ github.event.before }}"
          after="${{ github.sha }}"

          if [[ "$before" =~ ^0+$ ]]; then
            # A new branch or the repository's first-ever push: there is no
            # prior ref to diff from. This is a single-branch, direct-to-main
            # repository, so the correct approximation is "every commit
            # reachable from here" -- a one-time, bounded cost paid once.
            echo "no prior ref (new branch or first push): checking every commit in history"
            commits="$(git rev-list --reverse "$after")"
          else
            commits="$(git rev-list --reverse "$before..$after")"
          fi

          if [[ -z "$commits" ]]; then
            echo "no new commits in this push to check"
            exit 0
          fi

          gate_status=0
          for c in $commits; do
            echo "::group::$(git log -1 --pretty='%h %s' "$c")"

            git checkout --quiet "$c"
            if present_at "$c" ".pre-commit-config.yaml"; then
              if git rev-parse "$c~1" >/dev/null 2>&1; then
                git reset --soft "$c~1"
              else
                echo "root commit: no parent to rebase onto, running as-is"
              fi
              pre-commit run --all-files --hook-stage pre-commit || gate_status=1
            else
              echo ".pre-commit-config.yaml did not exist yet at this commit -- nothing to run pre-commit-stage gates against"
            fi

            # The soft reset above (if it ran) moved HEAD to c~1; the two
            # gates below read HEAD's own subject and diff HEAD against its
            # parent directly, not the index, so HEAD needs to be back at c.
            git checkout --quiet "$c"
            if present_at "$c" "scripts/check-commit-msg.sh"; then
              scripts/check-commit-msg.sh || gate_status=1
            else
              echo "scripts/check-commit-msg.sh did not exist yet at this commit -- skipping"
            fi
            if present_at "$c" "scripts/check-tests-kept.sh"; then
              scripts/check-tests-kept.sh || gate_status=1
            else
              echo "scripts/check-tests-kept.sh did not exist yet at this commit -- skipping"
            fi

            echo "::endgroup::"
          done

          git checkout --quiet "$after"
          exit "$gate_status"

      # ⚠️ The **full** run, which is CI's half of `testing.md` rule 16 — the
      # narrowed one is a pre-commit hook. ⚠️ **After** the per-commit gate loop,
      # deliberately: a full mutation pass over a workspace whose tests do not
      # pass is 23 s of noise, and the loop is what says so plainly.
      # ⚠️ `CARGO_INCREMENTAL` is **not** inherited here: the gate loop sets it
      # in its own *step* env, which never reaches a sibling step. It arrives
      # only because `Swatinem/rust-cache` exports it into `GITHUB_ENV` — and
      # that action returns early when the cache service is unavailable, so this
      # step can run incremental. `build.md` rule 21 wants it always; setting it
      # at job level is the fix and is a workflow change beyond this row.
      - name: mutation testing (full)
        run: scripts/check-mutants.sh --full

      # ⚠️ **The negative suite, which nothing invoked until `M0.30`.** Its only
      # callers were `m-1-complete.sh` and `m0-complete.sh` — themselves invoked
      # by nothing, and run only while their own milestone is the current one.
      # So the proof that this project's gates can *fail* stopped running the
      # day a milestone closed, which is `AGENTS.md`'s "a gate nothing invokes
      # is a preference" applied to the suite that tests the gates.
      #
      # ⚠️ Not a pre-commit hook: it builds several cargo fixtures and NFR-56
      # gives the whole hook suite 10 s. Per-push is where it fits.
      - name: every gate fails on a broken artifact
        # ⚠️ `always()`: an earlier failing step in this job would otherwise
        # skip this one, and a run that stops at the first failure never
        # learns whether the second commit also broke something. `M1.26`.
        if: always()
        # ⚠️ **And a case that did not run is not a case that passed.** The
        # suite exits 0 with a case skipped for a missing tool, which is right
        # for the suite and wrong for this step: dropping an `install` above
        # would silently un-prove a gate while CI stayed green. `M0.26` built
        # `SKIPPED_COUNT` for exactly that, and until `M0.30` nothing read it.
        run: |
          # ⚠️ `set -o pipefail`, and it is the whole step. GitHub's default
          # `run` shell is `bash -e {0}` with **no** pipefail, so
          # `negative.sh | tee` takes tee's status and the step could not fail
          # when the suite did — measured by review with a gate's branch
          # deleted: suite exit 1, step exit 0. The sibling step above sets it
          # for the same reason.
          set -euo pipefail
          tests/gates/negative.sh | tee /tmp/negative.out
          # ⚠️ `|| true`. Under the `pipefail` above, a non-matching `grep`
          # exits 1 and `set -e` kills the step *here* — so the guard below,
          # written for exactly that case, could never run and the absent line
          # was reported as a shell failure instead. `M1.26`, measured.
          n="$(grep '^SKIPPED_COUNT ' /tmp/negative.out | tail -1 | sed 's/^SKIPPED_COUNT //')" || true
          if [ -z "$n" ]; then
            echo "::error::the suite printed no SKIPPED_COUNT line"; exit 1
          fi
          if [ "$n" != "0" ]; then
            echo "::error::$n case(s) skipped in CI — a gate went unproven"
            grep '^SKIPPED_CASES ' /tmp/negative.out; exit 1
          fi

      # ⚠️ **`check-milestone-review.sh` is deliberately NOT a step here**, and
      # the first version of `M0.30` wired it in before review measured what
      # that does. It is a *completion* gate: `review.md` rule 11 says it
      # "refuses a milestone's completion", and its own header says commits may
      # accumulate between reviews. So it is red for most of every milestone's
      # life by design, and a per-push step would be red on a tree where every
      # other gate passes — making a real failure indistinguishable from work in
      # progress, which is the shape this workflow's own header already records
      # a finding against. ⚠️ `reviews/README.md`'s claim that CI *can* check
      # milestone coverage is a claim about **capability** and is true — the
      # verdicts are tracked, so CI could. What is absent is a wired step, and
      # `M0.30`'s notes say exactly that. An earlier version of this comment
      # said the claim "stays untrue" and attributed that to those notes, which
      # say the opposite; the failure mode was a reader deleting a correct
      # sentence.

# Wires every gate script in scripts/ as a local hook, so a fresh clone
# inherits the exact same enforcement this repository's own hand-installed
# .git/hooks only ever gave the machine they were typed on. `M-1.14`.
#
# ⚠️ **Install with `scripts/setup-hooks.sh`, not `pre-commit install`**
# (`M10.24`). The tracked hooks in `.githooks/` delegate straight back to
# `pre-commit run --hook-stage <stage>` against this file, and route the
# pre-commit stage through `scripts/docker-test.sh`'s resource caps — three
# gates here run cargo, and on WSL2 an uncontained runaway takes the machine
# down. `pre-commit install` refuses outright once `core.hooksPath` is set, and
# its suggested remedy is to unset it, which is the containment being undone. See AGENTS.md's non-negotiables for what each gate
# enforces and why; this file only says when each one runs.
#
# `default_install_hook_types` covers both stages with the one command --
# without it, `pre-commit install` wires `pre-commit` only, and a contributor
# who never separately runs `pre-commit install --hook-type commit-msg` gets
# half the enforcement without any indication the other half is missing.
default_install_hook_types: [pre-commit, commit-msg]

# `.github/workflows/gates.yml` runs `pre-commit run --all-files` against
# this exact file, so a check written once here is never reimplemented in
# CI -- doc 21 §9's rule that hooks and CI must call the same scripts, or
# the version that matters is whichever one nobody ran.
repos:
  - repo: local
    hooks:
      # --- pre-commit stage: every gate that reads the staged index or the
      # whole tracked tree, none of which take a file-list argument. Each
      # already reports its own violations and its own "ok"/"skip"; pre-commit
      # only needs to know whether the process exited zero.
      - id: check-reviewed
        name: "non-negotiable 4: every commit is reviewed, bound to the staged diff by hash"
        entry: scripts/check-reviewed.sh
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
      - id: check-drift
        name: "non-negotiable 2: no threshold is read from an environment variable"
        entry: scripts/check-drift.sh
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
      - id: check-layering
        name: "architecture.md + rust-style.md rule 3 + security.md rule 4: crate manifests hold"
        entry: scripts/check-layering.sh
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
      - id: check-sans-io
        name: "non-negotiable 5: business logic is sans-I/O"
        entry: scripts/check-sans-io.sh
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
      - id: check-core-contract
        name: "non-negotiable 6: an oqueue-core trait change updates every implementor and the ADR in one commit"
        entry: scripts/check-core-contract.sh
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
      - id: check-unsafe
        name: "non-negotiable 7: unsafe lives in three crates only, and every SAFETY block is baselined"
        entry: scripts/check-unsafe.sh
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
      - id: check-secrets
        name: "M9.14: no secret- or key-material-shaped field derives Debug unredacted"
        entry: scripts/check-secrets.sh
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
      - id: build-index-check
        name: "M-1.33: generated index regions (standards table, skills table, research tag index) are current"
        entry: scripts/build-index.sh --check
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
      - id: check-requirements-trace
        name: "M-1.24: every milestone plan names a requirement it serves, and every id it names exists"
        entry: scripts/check-requirements-trace.sh
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
      - id: check-backlog-rows
        name: "M4.27: every backlog row has one state cell sdd.md defines, and a task with a commit is not todo"
        entry: scripts/check-backlog-rows.sh
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
      - id: check-milestone-handoff
        name: "M4.73: a milestone marked complete has handed on the rows it left open"
        entry: scripts/check-milestone-handoff.sh
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
      - id: check-file-size
        name: "code-structure.md rules 16, 17, 24: a file is at most 500 lines, and no module is a dumping ground"
        entry: scripts/check-file-size.sh
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
      - id: check-readmes
        name: "code-structure.md rules 13-15: every crate has a README.md and AGENTS.md, and the README's dependencies match Cargo.toml"
        entry: scripts/check-readmes.sh
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
      - id: check-hot-path-bench
        name: "performance.md rules 18-19: a hot-path marker names a real row in the table, and every row is covered unless allowlisted"
        entry: scripts/check-hot-path-bench.sh
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
      - id: check-portability
        name: "skills/README.md rules 1-3: no vendor syntax in AGENTS.md/SKILL.md, every skill names itself, every command is a pointer"
        entry: scripts/check-portability.sh
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
      - id: check-topic-list-scope
        name: "M9.11: no code path materializes the global topic list to answer a client request"
        entry: scripts/check-topic-list-scope.sh
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
      - id: check-fencing-seam
        name: "M4.11, M4.36: no handler constructs any Refusal code outside crate::fencing"
        entry: scripts/check-fencing-seam.sh
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
      - id: check-idempotence-enabled
        name: "M11.9, M11.md task 12: M2's enable.idempotence=false client-config workaround stays retired"
        entry: scripts/check-idempotence-enabled.sh
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
      # The first pre-commit gate that shells out to cargo; `check-coverage`
      # and `check-mutants` follow it. ⚠️ **Not for speed** — `fail_fast` is set nowhere, so pre-commit
      # runs every hook whatever the order, and no time is saved by putting the
      # slow one last. An earlier version of this comment claimed otherwise and
      # review disproved it with a two-hook config. The order is for the *output*:
      # a run that fails several gates is read top-down, and the cargo output is
      # by far the longest. ⚠️ Three hooks follow it, so "anything below it is
      # scrolled past" is not literally true — the ordering puts the *longest*
      # output late, not last.
      # Run with no argument, so a commit touching two crates is not checked
      # against whichever one somebody named.
      - id: check-crate
        name: "rust-style.md: rustfmt, clippy with warnings denied, and the tests pass"
        entry: scripts/check-crate.sh
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true

      # ⚠️ **Ordering here buys nothing** — `fail_fast` is unset, so this runs
      # even after `check-crate` fails and pays the instrumented rebuild anyway.
      # It is late because a reader scans a failing run top-down and this gate's
      # output is long — the same *output-length* reason the comment above
      # gives, which is not a speed argument either. `M0.15`.
      - id: check-coverage
        name: "testing.md rule 19: per-crate line coverage floor"
        entry: scripts/check-coverage.sh
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true

      # Pure text read from the index, so it costs milliseconds: the backend
      # matrix cannot reach a commit malformed. ⚠️ **Format only.** The
      # agreement-with-the-roster half is deliberately *not* here and takes
      # `--against-roster` to run at all: the `check-crate` hook above writes
      # a roster containing only `fake`, so comparing against it here failed
      # every commit on a freshly-cleaned tree. It belongs where a complete
      # roster is guaranteed — `scripts/gates/m1-complete.sh`. `M1.21`.
      - id: check-conformance-matrix
        name: "M1.21: the recorded backend matrix is well-formed"
        entry: scripts/check-conformance-matrix.sh
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true

      # ⚠️ Narrowed to the staged diff, so cost is proportional to the change:
      # ~4.8 s warm for a 13-mutant diff, and a skip when a diff produces none.
      # `testing.md` rule 17 — a survivor is killed or argued; rule 16 is what
      # puts the narrowed run here and the full one in CI. `M0.17`.
      - id: check-mutants
        name: "testing.md rule 17: a surviving mutant is killed or argued"
        entry: scripts/check-mutants.sh
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true

      # ⚠️ **Genuinely last**, and this one has to be: it adds up the timings
      # every gate above recorded, so anything after it would be uncounted.
      # `M0.16`.
      - id: check-budget
        # ⚠️ `verbose: true`, and it is load-bearing rather than tidy.
        # pre-commit prints a hook's output only when the hook fails; this gate
        # reports its most important findings on a *passing* exit — the
        # compiling-run skip, and `M1.30`'s warning that the exemption has
        # become the suite's normal path. Without this the warning is computed
        # and thrown away, and "this exists so the crossing is noticed" is
        # false. Measured: a hook that prints and exits 0 renders as `Passed`
        # and nothing else.
        verbose: true
        name: "NFR-56: the pre-commit suite stays within its time budget"
        entry: scripts/check-budget.sh
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true

      # --- commit-msg stage: the two gates that read the message file itself,
      # which pre-commit passes as this stage's one positional argument.
      - id: check-commit-msg
        name: "non-negotiable 1: the commit subject names a real backlog task"
        entry: scripts/check-commit-msg.sh
        language: system
        stages: [commit-msg]
      - id: check-tests-kept
        name: "non-negotiable 2: a removed test names its own removal"
        entry: scripts/check-tests-kept.sh
        language: system
        stages: [commit-msg]

# The workspace root. `M0.2`.
#
# Everything a crate can inherit lives here rather than in the crate: the
# edition, the toolchain floor, the licence, every dependency version, and every
# lint. A crate's own `Cargo.toml` should say what makes that crate different,
# and nothing else — `rust-style.md` rule 3 states this for lints specifically,
# and the reasoning generalises: two places holding one fact is two places to
# fix when it changes, and only one of them gets fixed.
#
# The `[profile]` sections are at the bottom, and why each number is that number
# is [ADR-0001](docs/internal/product/decisions/0001-build-profiles.md) rather
# than this file — a profile table reads as tuning, and two of its entries exist
# to avoid traps that are invisible in the result.

[workspace]
# ⚠️ Resolver 3, not the 2 the milestone plan assumed — and this line is
# **load-bearing, not merely explicit**. Edition 2024 implies resolver 3 for a
# *package* manifest, but this is a **virtual** manifest with no `[package]`, so
# there is no edition to imply anything: without this line cargo warns and falls
# back to resolver 1, silently reverting feature unification and MSRV-aware
# version selection. Deleting it because "edition 2024 already does this" is the
# specific mistake to avoid.
resolver = "3"

members = [
    "crates/oqueue-core",
    "crates/oqueue-buf",
    "crates/oqueue-checksum",
    "crates/oqueue-codec",
    "crates/oqueue-index",
    "crates/oqueue-store",
    "crates/oqueue-coordinator",
    "crates/oqueue-crypto",
    "crates/oqueue-compact",
    "crates/oqueue-broker",
    "crates/oqueue-testkit",
    "bin/oqueue",
]

[workspace.package]
# One version for the whole workspace. `0.0.0` because nothing here is
# published, and a number that pretends otherwise invites someone to depend on
# it. `M13` is where release engineering decides what versioning becomes.
version = "0.0.0"
edition = "2024"
# The same floor `rust-toolchain.toml` pins. ⚠️ Two files, one fact — but they
# are not redundant: the toolchain file decides what *this* checkout compiles
# with, and this field decides what a *consumer* is told they need. Bumping is
# `build.md` rule 1's task-with-a-commit either way.
rust-version = "1.97.1"
license = "Apache-2.0"

# Every third-party version is decided once, here, and every crate writes
# `foo.workspace = true`. Empty until a crate needs something. ⚠️ **`M0.4`'s
# ADR-0002 chooses Tokio and adds nothing**, because a decision is not a use and
# a workspace dependency nothing references compiles nothing. That is a
# statement about M0.4, not a prediction about the rest of M0: `M0.13` wires an
# allocator. ⚠️ **`M0.10` and `M0.11` do not take a runtime**, not even under
# `[dev-dependencies]`: both rows require `Waker::noop()` and a busy poll to
# drive a boxed future, because `M0.16` rests NFR-56's floor on no M0 task
# compiling one — and `check-layering.sh` never reads `[dev-dependencies]`, so a
# violation would land green and nothing here would notice.
[workspace.dependencies]
# `error-handling.md` rule 3: each crate defines its error enum with thiserror.
thiserror = "2"
# Property testing. `testing.md` rule 20; doc 18 §5.6 makes it mandatory per PR.
proptest = "1"
# Wiping key material on drop. `security.md` rule 8 ("key material is
# zeroized on drop") names no crate; this is the one the Rust ecosystem
# standardised on, and `ring` — already in this workspace's graph through
# `object_store`'s `ring` feature — depends on it, so it resolves nothing
# new. ⚠️ Pure Rust, no `build.rs`, no C toolchain (`cargo tree -p zeroize`
# shows only the optional `zeroize_derive` proc macro, which this project
# does not enable): doc 20 §1's budget is untouched. `oqueue-core` takes it
# directly for `Dek` (`M8.1`).
zeroize = { version = "1", default-features = false, features = ["alloc"] }
# Constant-time comparison of secret bytes. `Redacted`'s own documentation
# has named its non-constant-time `PartialEq` as an `M8` obligation since
# `M0.6`, and `security.md`'s no-timing-oracle instinct is the reason.
# ⚠️ Same footprint argument as `zeroize`: pure Rust, no build script,
# already in `Cargo.lock` transitively through `ring`.
subtle = { version = "2", default-features = false }
# The global allocator, set in `bin/oqueue` only. ADR-0007. ⚠️ Pulls a C
# toolchain — permitted by NFR-42 ("cargo and a C compiler"), recorded here
# because `AGENTS.md` forbids it happening without a reason.
mimalloc = "0.1"
# Heap profiling, behind a non-default feature. ⚠️ Its ARM page-size trap is
# why the feature is off by default — see ADR-0007.
tikv-jemallocator = "0.6"
# `oqueue-store`'s S3 and GCS backends. ADR-0008 (`M1.1`). `aws-base` for
# `M1.15`'s S3 backend; `gcp-base` for `M1.17`'s GCS backend. `ring`, not
# `aws-lc-rs`: ADR-0012 keeps the default build's dependency footprint at
# cargo + a C compiler (NFR-42) — `aws-lc-rs`'s FIPS-validated path needs
# CMake and Go, a cost `M8` alone should pay.
object_store = { version = "0.14", default-features = false, features = [
    # ⚠️ Not the `aws`/`gcp` convenience features — both bundle `aws-lc-rs`
    # unconditionally (`aws = [..., "aws-lc-rs"]`, `gcp = [..., "aws-lc-rs"]`
    # in `object_store`'s own Cargo.toml), which needs CMake and Go and would
    # put both in the default build's toolchain (ADR-0012). `aws-base`/
    # `gcp-base` compile the same modules (`#[cfg(feature = "aws-base")]`/
    # `"gcp-base"]` gate them, not `feature = "aws"`/`"gcp"`) without
    # bundling a crypto provider. `reqwest`'s own `rustls` feature *also*
    # bundles `aws-lc-rs` unconditionally (`reqwest`'s Cargo.toml, not this
    # project's) — there is no Cargo feature that reaches through `object_store`
    # into `reqwest`'s feature set from here, so avoiding it needs
    # `oqueue-store`'s own feature-only `reqwest` and `rustls` entries below,
    # plus code that installs `ring`'s `CryptoProvider` at runtime instead of
    # letting a Cargo feature pick one at compile time.
    "aws-base",
    "gcp-base",
    "reqwest",
    "ring",
] }
# The runtime ADR-0002 chose. `oqueue-core` names it nowhere and no crate
# takes the dependency until it does real I/O — `M1.15` is the first. Feature
# set kept to what `object_store`'s HTTP client and this crate's own tests
# (driving real calls against MinIO) actually need — no `full`.
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "time",
] }

# ⚠️ **Dev-only, and only for `oqueue-store`'s simulated transport** (`M10.2`).
# `object_store`'s `HttpRequestBody` exposes `as_bytes()` only for the `Bytes`
# variant, and a PUT carries a `PutPayload` — so reading what the store sent
# needs `http_body::Body`, and this is the ergonomic way to collect it.
# ⚠️ `testing.md` says `http-body-util` is "not needed"; that is true of the
# *response* body, which `From<Vec<u8>>` covers, and `M1.22`'s probe never
# issued a PUT. Already in `Cargo.lock` through `reqwest`, so this resolves
# nothing new, and pure Rust — doc 20 §1's C-toolchain budget is untouched.
http-body-util = "0.1"

# ⚠️ Not used directly in any crate's code — present purely to steer Cargo's
# feature unification for the *shared* `reqwest` instance `object_store`
# already depends on, away from the `rustls` feature's bundled `aws-lc-rs`
# (ADR-0012). `rustls-no-provider` gets TLS wired up with no crypto provider
# picked at compile time; `oqueue-store` installs `ring`'s at runtime instead
# (`crates/oqueue-store/src/tls.rs`). Pinned to the same major version
# `object_store` 0.14.1 itself requires, so Cargo resolves one `reqwest`, not
# two.
reqwest = { version = "0.13", default-features = false, features = [
    "http2",
    "rustls-no-provider",
] }
# The crypto-provider install call itself needs the `rustls` crate directly —
# reqwest re-exports no such API. `default-features = false` avoids rustls's
# own default, which is `aws_lc_rs` (ADR-0012, same reasoning).
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
# The certificate/key types `oqueue-broker`'s TLS listener loads from PEM
# (`M9.5`) — `PemObject::from_pem_slice`/`pem_slice_iter`, unconditionally
# compiled in this version (no separate `pem` feature to request). `rustls`
# itself already depends on this crate (`pki-types/alloc`); this entry
# only makes it a direct dependency too, resolving nothing new — already
# in `Cargo.lock` transitively.
rustls-pki-types = { version = "1", default-features = false, features = [
    "alloc",
] }
# Wraps a `tokio::net::TcpStream` in `rustls`'s handshake — `oqueue-broker`'s
# TLS listener (`M9.5`). Pure Rust, already in `Cargo.lock` transitively
# through `reqwest`'s own `rustls-no-provider` path.
tokio-rustls = { version = "0.26", default-features = false, features = [
    "tls12",
] }

# ── Lints ───────────────────────────────────────────────────────────────────
#
# Declared once, opted into per crate with `lints.workspace = true`.
# `rust-style.md` rules 3-6. ⚠️ An allowance is a named exception with a reason
# *here*, never a silent `#[allow]` at a call site — a silent one is
# indistinguishable from an oversight the next time somebody reads that
# function.

[workspace.lints.rust]
# Backs `contracts.md` rule 5: a seam's types are inspectable in a test failure.
missing_debug_implementations = "warn"
# Backs `code-structure.md` rule 12: a `pub` item unreachable from the crate
# root is a module boundary someone forgot to finish.
unreachable_pub = "deny"
unused_qualifications = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
# ⚠️ `priority = -1` is not load-bearing *today* and is here anyway. Cargo
# applies this table in priority order, and the moment one entry is a group and
# another is a member of that group being allowed, the group needs the lower
# priority or the build fails outright. Nothing below is such a member —
# `unwrap_used` and `expect_used` are restriction lints, in neither group — so
# removing this would build. It stays because the first named exception to
# pedantic or nursery is exactly the change most likely to be made in a hurry,
# and a hard error at that moment reads as "the lint config is broken" rather
# than "add a priority".
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

# `code-structure.md` rule 26 / `rust-style.md` rule 6. ⚠️ Denied here and
# allowed per test module rather than the reverse: a test may unwrap, and
# expressing "outside `#[cfg(test)]`" is not something a lint table can say, so
# the allowance is written where a reader can see which tests took it.
unwrap_used = "deny"
expect_used = "deny"

# ── Profiles ────────────────────────────────────────────────────────────────
#
# Six, per `build.md` rule 10, and **root-only**: a `[profile]` section in a
# member crate is ignored, and cargo says so on stderr while still exiting 0 —
# which is why `check-crate.sh` reads `cargo metadata`'s stderr separately
# rather than folding it into the JSON.
#
# Reasoning is [ADR-0001](docs/internal/product/decisions/0001-build-profiles.md).
# The three settings worth knowing without opening it:
#
#   * `lto = "thin"` in `release` is **mandatory, not tuning** — without it a
#     non-generic `pub fn` past ~100 MIR cost units does not inline across an
#     rlib boundary, and this workspace is eleven crates by `M0.8`. ADR-0003.
#   * Fat LTO is in `dist` and not in `release` because it costs ~2.3x build
#     time, paid by every developer on every release build.
#   * `bench` pins `inherits = "dist"` because it would otherwise inherit
#     `release`, and you would benchmark codegen you never ship.

[profile.dev]
opt-level = 0
debug-assertions = true
# `build.md` rule 7 / `security.md` rule 4. In `dev` this is already the
# default; it is written out because the rule is "every profile" and a reader
# checking compliance should not have to know which defaults happen to agree.
overflow-checks = true
# ⚠️ Linux and macOS only, which is the whole supported set — `portability.md`
# rule 3 makes Windows a non-target and WSL2 the path on it. A Windows-msvc
# build would reject this value.
split-debuginfo = "unpacked"

# Dependencies are ~90% of the compiled code and debuginfo is 60-70% of
# `target/debug`. `build.md` rule 11. ⚠️ `opt-level = 2` here is not about the
# binary: it is what makes a debug integration test finish, once compression and
# crypto are in the loop, and it is cached across every later build.
[profile.dev.package."*"]
opt-level = 2
debug = false

# Proc macros and build scripts. They run at compile time, so their optimization
# level is build *speed*, not runtime speed, and they are compiled once.
[profile.dev.build-override]
opt-level = 3

# ⚠️ **Mutation testing only** — `scripts/mutants.sh` passes `--profile mutants`,
# and nothing else selects it. `M4.19` measured why it exists: a narrowed run
# over `oqueue-broker` is ~4 s *per mutant*, and 30 mutants is ~2 min, so the
# gate is a rebuild loop and anything that shortens one rebuild is multiplied
# by the mutant count.
#
# ⚠️ **It differs from `dev` in exactly one thing: no debuginfo.** Dependencies
# already carry none (`[profile.dev.package."*"]` above sets `debug = false`),
# so this drops it for the workspace crates — which is what a mutation run
# rebuilds over and over. ⚠️ `split-debuginfo` is inherited and moot at
# `debug = 0`.
#
# ⚠️ **`opt-level`, `debug-assertions` and `overflow-checks` are deliberately
# unchanged from `dev`, because changing them could change a verdict.** A
# mutant is caught by a test failing; an assertion or an overflow check is
# often the thing that fails. Debuginfo is not — it is what a *debugger* reads,
# and no test in this workspace asserts on a backtrace's line numbers. That is
# the whole argument for this profile being quality-neutral: it removes output
# nothing under test consumes.
#
# ⚠️ `overflow-checks` is written out despite being inherited — `security.md`
# rule 4 is "every profile", and `[profile.dev]` above states the same reason
# for the same redundancy.
[profile.mutants]
inherits = "dev"
overflow-checks = true
debug = 0

[profile.release]
opt-level = 3
# ⚠️ **Mandatory, not an optimization** — `build.md` rule 5. A crate boundary is
# an optimization barrier: without LTO, a non-generic `pub fn` with no
# `#[inline]` cannot be inlined by a caller in another crate, because its MIR is
# not in the rlib. ⚠️ ADR-0003 qualifies this — measured on 1.97.1, rustc
# encodes MIR automatically below ~100 MIR cost units, so small functions do
# inline unannotated. ⚠️ And LTO does not subsume `#[inline]`: it makes the
# callee's IR available, while the annotation separately raises LLVM's inline
# cost threshold, and in a measured band of ~28-32 statements the annotation is
# what decides. Above it neither form inlines: ADR-0003's table has >=36
# statements not inlined with or without `#[inline]`, so "from ~28 up" claimed a
# floor where there is a window.
# In a monolith LTO is worth a few percent; here it decides
# whether the codec inlines at all. ⚠️ And `lto = false` with
# `codegen-units = 1` performs **no LTO whatsoever** — strictly worse than the
# stock profile (`build.md` rule 6). Deleting this line while keeping a low
# `codegen-units` is the mistake that looks like tuning.
lto = "thin"
codegen-units = 16
# A decoder panic must not kill a node serving other tenants. `build.md` rule 8.
panic = "unwind"
# Production flamegraphs symbolicate without carrying full debuginfo.
debug = "line-tables-only"
strip = "none"
# ⚠️ In `release` too, not only in `dev`. `build.md` rule 7 and `security.md`
# rule 4: a silently wrapping offset is a correctness bug this project cannot
# detect any other way, and the branch is predictable.
overflow-checks = true

# Tagged artifacts only. ⚠️ ~2.3x build time over `release`, which is why it is
# a separate profile rather than a stronger `release` — see ADR-0001.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

# ⚠️ **Differs from `dist` in exactly one way, and that is the rule** —
# `build.md` rule 10, "`dist` + `debug = true`, nothing else". Every other
# divergence silently benchmarks a different program, and `debug-assertions`
# left on is the most common way a Rust benchmark is invalidated.
#
# ⚠️ Doc 18 §3.6 also lists `strip = false` here. It is omitted because it is
# not a difference: `dist` inherits `strip = "none"` from `release`, and
# `false` is that same value spelled differently, so writing it would be a
# second key that changes nothing while breaking the "exactly one" property on
# sight. The protection it was reaching for is real, so it is stated as a rule
# instead: **`release` must not strip**, because `bench` inherits from it and a
# stripped binary defeats the symbol attribution `debug = true` is here for.
#
# ⚠️ **`bench` has no target directory of its own — it writes to
# `target/release`.** `dist` gets `target/dist` and `release-checked` gets
# `target/release-checked`, but cargo gives the built-in `bench` profile the
# `release` directory, so a benchmark run replaces `target/release/` with a
# fat-LTO, full-debuginfo binary that is *not* the release build, and the two
# swap costs nothing and rebuilds nothing — both profiles' objects coexist in
# `target/release/deps`, and only the uplifted artifact is a single slot — so
# there is no slow rebuild to notice it by. Anything that benchmarks sets its
# own `CARGO_TARGET_DIR`. ADR-0001, commitment 4.
[profile.bench]
inherits = "dist"
debug = true

# A CI safety net: production codegen with the assertions `release` turns off,
# so an overflow or a broken invariant surfaces under the optimizer that will
# actually ship rather than only under `dev`.
[profile.release-checked]
inherits = "release"
debug-assertions = true
